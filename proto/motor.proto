// Motor Messages

syntax = "proto3";

enum MotorControlType {
    COMMUTATION = 0;
    SINUSOIDAL = 1;
    FIELDORIENTADEDCONTROL = 2;
}

enum MotorControlMode {
    OPENMODE = 0;
    VOLTAGE = 1;
    SPEED = 2;
    TORQUE = 3;
}

message MotorControl {
    bool    enable = 1;
    sint32  pwm = 2;
    MotorControlType    controlType = 3;
    MotorControlMode    controlMode = 4;
    uint32 iMotMax = 5;
    uint32 iDCMax = 6;
    uint32 nMotMax = 7;
    uint32 fieldWeakMax = 8;
    uint32 phaseAdvancedMax = 9;
    bool cruiseCtrlEnabled = 10;
    uint32 cruiseControlTarget = 11;
}

message MotorFeedback {
    bool     enabled = 1;
    sint32   speed = 2;
    sint32   target = 3;    
    uint32   error = 4;
}

message MotorBuzzer {
    uint32  freq = 1;
    uint32  pattern = 2;
}

message MotorboardControl {
    optional MotorControl left = 1;
    optional MotorControl right = 2;
    optional MotorBuzzer buzzer = 3;
}

message MotorboardFeedback {
    MotorFeedback left = 1;
    MotorFeedback right = 2;
    float voltage = 3;
    float current = 4;
    float temperature = 5;
    bool charging = 6;
    bool connected = 100;
}